<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1020"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#111827"/>
      <stop offset="1" stop-color="#1F2937"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#22C55E"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1480" cy="120" r="180" fill="#2563EB" fill-opacity="0.12"/>
  <circle cx="180" cy="760" r="220" fill="#A855F7" fill-opacity="0.09"/>

  <rect x="90" y="70" width="1420" height="760" rx="26" fill="url(#panel)" stroke="#2D3748"/>

  <rect x="120" y="110" width="250" height="680" rx="18" fill="#0F172A" stroke="#2D3748"/>
  <text x="150" y="165" fill="#E2E8F0" font-family="Arial, sans-serif" font-size="28" font-weight="700">ByteBuddy</text>
  <text x="150" y="205" fill="#94A3B8" font-family="Arial, sans-serif" font-size="16">AI Chatbot</text>

  <rect x="155" y="250" width="180" height="44" rx="12" fill="#1E293B"/>
  <text x="174" y="278" fill="#E2E8F0" font-family="Arial, sans-serif" font-size="15">HF Token</text>
  <rect x="155" y="315" width="180" height="42" rx="12" fill="#1E293B"/>
  <text x="173" y="342" fill="#E2E8F0" font-family="Arial, sans-serif" font-size="15">Model</text>

  <rect x="155" y="392" width="180" height="104" rx="14" fill="#111827" stroke="#374151"/>
  <text x="175" y="425" fill="#E2E8F0" font-family="Arial, sans-serif" font-size="15">Temperature</text>
  <rect x="171" y="440" width="148" height="12" rx="6" fill="#374151"/>
  <rect x="171" y="440" width="98" height="12" rx="6" fill="url(#accent)"/>

  <rect x="155" y="525" width="180" height="104" rx="14" fill="#111827" stroke="#374151"/>
  <text x="175" y="558" fill="#E2E8F0" font-family="Arial, sans-serif" font-size="15">Max Tokens</text>
  <rect x="171" y="574" width="148" height="12" rx="6" fill="#374151"/>
  <rect x="171" y="574" width="108" height="12" rx="6" fill="#22C55E"/>

  <rect x="155" y="680" width="180" height="48" rx="12" fill="#1E293B"/>
  <text x="201" y="710" fill="#E2E8F0" font-family="Arial, sans-serif" font-size="15">Clear Chat</text>

  <rect x="420" y="110" width="1030" height="680" rx="24" fill="#0F172A" stroke="#2D3748"/>
  <text x="455" y="165" fill="#E2E8F0" font-family="Arial, sans-serif" font-size="38" font-weight="700">🤖 ByteBuddy - AI Chatbot</text>
  <text x="455" y="205" fill="#94A3B8" font-family="Arial, sans-serif" font-size="20">Your intelligent conversation partner powered by Hugging Face</text>

  <rect x="460" y="250" width="700" height="120" rx="18" fill="#1E293B"/>
  <text x="492" y="300" fill="#E5E7EB" font-family="Arial, sans-serif" font-size="24">User</text>
  <text x="492" y="335" fill="#CBD5E1" font-family="Arial, sans-serif" font-size="20">Can you help me summarize this project?</text>

  <rect x="680" y="395" width="720" height="150" rx="18" fill="#111827" stroke="#374151"/>
  <text x="712" y="445" fill="#E5E7EB" font-family="Arial, sans-serif" font-size="24">ByteBuddy</text>
  <text x="712" y="485" fill="#CBD5E1" font-family="Arial, sans-serif" font-size="20">This project is a lightweight Streamlit chatbot built with Python.</text>
  <text x="712" y="515" fill="#CBD5E1" font-family="Arial, sans-serif" font-size="20">It connects to Hugging Face models and lets users tune</text>
  <text x="712" y="545" fill="#CBD5E1" font-family="Arial, sans-serif" font-size="20">response settings for real-time AI conversations.</text>

  <rect x="460" y="585" width="940" height="90" rx="18" fill="#0B1220" stroke="#2D3748"/>
  <text x="488" y="628" fill="#94A3B8" font-family="Arial, sans-serif" font-size="22">Type your message here...</text>
  <rect x="1300" y="612" width="72" height="42" rx="10" fill="url(#accent)"/>
  <text x="1320" y="640" fill="#0F172A" font-family="Arial, sans-serif" font-size="18" font-weight="700">Send</text>

  <text x="1230" y="760" fill="#94A3B8" font-family="Arial, sans-serif" font-size="16">ByteBuddy v1.0 | Powered by Hugging Face Inference API</text>
